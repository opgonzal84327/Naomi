<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">English Story Practice</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --primary: #ff8c42;
            --primary-dark: #e67329;
            --secondary: #4caf50;
            --secondary-light: #e8f5e9;
            --accent: #ffd166;
            --bg-color: #fffdf7;
            --card-bg: #ffffff;
            --text-main: #2d3142;
            --text-muted: #5c6274;
            --border-radius: 18px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#ffe8b3 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            color: var(--text-main);
            line-height: 1.7;
            padding: 20px;
        }
        header {
            text-align: center;
            max-width: 1200px;
            margin: 0 auto 25px auto;
            background: var(--card-bg);
            padding: 25px 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
            border-bottom: 5px solid var(--primary);
        }
        header h1 { font-family: 'Fredoka', sans-serif; font-size: 2.3rem; color: var(--primary-dark); margin-bottom: 5px; }
        header p { color: var(--text-muted); font-weight: 600; font-size: 1.05rem; }
        .main-container {
            display: grid;
            grid-template-columns: 1.85fr 1.15fr;
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
            align-items: start;
        }
        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 28px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
            margin-bottom: 25px;
        }
        .story-image-box {
            width: 100%;
            margin-bottom: 22px;
            border-radius: 14px;
            overflow: hidden;
            background-color: #fff5e4;
            border: 3px dashed #ffd166;
            text-align: center;
        }
        .story-image-box img { width: 100%; max-height: 380px; object-fit: cover; display: block; }
        .paragraph-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 16px;
            padding: 10px 14px;
            border-radius: 12px;
            transition: background-color 0.25s ease;
        }
        .paragraph-row:hover { background-color: #fff9eb; }
        .paragraph-row.speaking { background-color: #fff2cc; box-shadow: 0 0 0 2px var(--accent); }
        .paragraph-row p { font-size: 1.15rem; flex: 1; }
        .vocab-highlight { color: #d95d1e; font-weight: 700; }
        .audio-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 6px 12px;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
            margin-top: 3px;
            box-shadow: 0 3px 0 var(--primary-dark);
        }
        .audio-btn:hover { background-color: var(--primary-dark); }
        .mini-audio-btn {
            background: #ffe8cc;
            border: none;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            cursor: pointer;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 4px;
        }
        .mini-audio-btn:hover { background: var(--accent); }
		.sidebar { 
			position: sticky; 
			top: 20px; 
			max-height: calc(100vh - 40px); 
			overflow-y: auto; 
		}
		.sidebar .card { margin-bottom: 0; }
        .sidebar h2 { font-family: 'Fredoka', sans-serif; color: var(--secondary); font-size: 1.4rem; margin-bottom: 12px; }
        .helper-subtitle { font-family: 'Fredoka', sans-serif; font-size: 1.05rem; color: var(--primary-dark); margin: 16px 0 8px 0; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 18px;
            font-size: 0.92rem;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        th { background-color: var(--secondary); color: white; font-family: 'Fredoka', sans-serif; text-align: left; padding: 10px 8px; font-size: 0.88rem; }
        td { padding: 8px; border-bottom: 1px solid #edf2f7; }
        tr:nth-child(even) { background-color: #f9fbf9; }
        .badge-type { display: inline-block; background-color: #e3f2fd; color: #1565c0; padding: 2px 8px; border-radius: 12px; font-size: 0.8rem; font-weight: 700; }
        .quiz-section h2 { font-family: 'Fredoka', sans-serif; color: var(--primary-dark); font-size: 1.7rem; margin-bottom: 18px; text-align: center; }
        .question-block { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 14px; padding: 16px 20px; margin-bottom: 16px; }
        .question-title { font-weight: 700; font-size: 1.08rem; margin-bottom: 10px; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .option-label { display: flex; align-items: center; gap: 8px; background: white; padding: 10px 14px; border-radius: 10px; border: 2px solid #e2e8f0; cursor: pointer; font-weight: 600; }
        .option-label:hover { border-color: var(--primary); background-color: #fffaf0; }
        .feedback-msg { margin-top: 10px; font-weight: 700; font-size: 0.98rem; display: none; }
        .feedback-correct { color: #2e7d32; }
        .feedback-incorrect { color: #c62828; }
        .grade-btn { display: block; width: 100%; background-color: var(--secondary); color: white; font-family: 'Fredoka', sans-serif; font-size: 1.3rem; padding: 14px; border: none; border-radius: 14px; cursor: pointer; box-shadow: 0 4px 0 #388e3c; margin-top: 20px; }
        #final-score { text-align: center; margin-top: 20px; padding: 18px; border-radius: 14px; background-color: var(--secondary-light); border: 2px solid var(--secondary); font-family: 'Fredoka', sans-serif; font-size: 1.35rem; color: #1b5e20; display: none; }
        @media (max-width: 900px) {
            .main-container { grid-template-columns: 1fr; }
            .sidebar { position: static; }
            .options-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <h1 id="story-title"></h1>
        <p id="story-subtitle"></p>
    </header>

    <div class="main-container">
        <div class="left-column">
            <div class="card">
                <div class="story-image-box" id="image-container"></div>
                <div id="story-paragraphs"></div>
            </div>

            <div class="card quiz-section">
                <h2>📝 Quiz: Answer the Questions!</h2>
                <div id="quiz-container"></div>
                <button class="grade-btn" onclick="gradeQuiz()">Grade Quiz ✔</button>
                <div id="final-score"></div>
            </div>
        </div>

        <aside class="sidebar">
            <div class="card">
                <h2>📖 Word Helper</h2>
                <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 10px;">Click 🔊 to listen to each word!</p>

                <h3 class="helper-subtitle">🏃‍♂️ Action Words (Verbs)</h3>
                <table>
                    <thead>
                        <tr><th>I / You / We / They</th><th>He / She / It</th><th>Meaning</th></tr>
                    </thead>
                    <tbody id="verbs-table-body"></tbody>
                </table>

                <h3 class="helper-subtitle">🌟 Other Helpful Words</h3>
                <table>
                    <thead>
                        <tr><th>Word</th><th>Meaning</th><th>Type</th></tr>
                    </thead>
                    <tbody id="words-table-body"></tbody>
                </table>
            </div>
        </aside>
    </div>

    <script>
        // =========================================================================
        // 🟢 ZONA DE DATOS DEL CUENTO (SOLO REEMPLAZA ESTO EN CADA HISTORIA NUEVA)
        // =========================================================================
        const storyData = {
            title: "🦁 Mia and Leo’s Market Picnic! 🐭",
            subtitle: "Unit 3: At the Market • Reading & Vocabulary Practice",
            imageFile: "https://raw.githubusercontent.com/opgonzal84327/Naomi/main/images/MiaMouse.jpg",
            paragraphs: [
                "It is a sunny morning, and Mia Mouse and Leo Lion are very hungry. They want to make a big, yummy lunch, so they open the kitchen cupboard to check their food.",
                "\"What's in the cupboard?\" asks Leo Lion.",
                "Mia Mouse looks inside and says:",
                "\"Well, there are some <b>carrots</b>, some <b>peas</b>, and two yellow <b>lemons</b>. There is also a big green <b>cabbage</b> and a brown <b>coconut</b>.\"",
                "\"Are there any <b>mangoes</b> or <b>pineapples</b>?\" asks Leo. \"I love sweet fruit!\"",
                "Mia looks again and shakes her head:",
                "\"No, there aren't. And there aren't any <b>mushrooms</b> or <b>peppers</b> either.\"",
                "\"Let's go to the market!\" says Leo.",
                "At the market, they see colorful stands full of fresh food. Mia buys three juicy <b>mangoes</b>, one sweet <b>pineapple</b>, and four green <b>kiwis</b>. Leo buys some yellow <b>corn</b>, red <b>peppers</b>, and a bag of <b>onions</b>.",
                "Suddenly, Mia sees a shiny green <b>lime</b> on the ground next to a basket. She picks it up and asks:",
                "\"Whose is it?\"",
                "A little bird named Pip flies down and chirps:",
                "\"It's <b>mine</b>! Thank you, Mia!\"",
                "\"You're welcome! And look, this basket of <b>oranges</b> is <b>yours</b> too, right?\" asks Leo.",
                "\"Yes, it is <b>mine</b>!\" says Pip happily.",
                "Mia and Leo walk back home with their full bags. They make a delicious <b>corn</b> and <b>pea</b> salad, and eat sweet <b>mangoes</b> and <b>kiwis</b> for dessert. What a great day at the market! The end!"
            ],
            verbs: [
                { base: "make", third: "makes", meaning: "hacer / preparar" },
                { base: "shake", third: "shakes", meaning: "mover / sacudir" },
                { base: "buy", third: "buys", meaning: "comprar" },
                { base: "see", third: "sees", meaning: "ver" },
                { base: "pick it up", third: "picks it up", meaning: "recogerlo" },
                { base: "ask", third: "asks", meaning: "preguntar / pedir" },
                { base: "fly down", third: "flies down", meaning: "bajar volando" },
                { base: "chirp", third: "chirps", meaning: "piar (pajarito)" },
                { base: "walk", third: "walks", meaning: "caminar" },
                { base: "look", third: "looks", meaning: "mirar" }
            ],
            otherWords: [
                { word: "sunny", meaning: "soleado", type: "Adjective" },
                { word: "colorful", meaning: "colorido", type: "Adjective" },
                { word: "cupboard", meaning: "alacena", type: "Noun" },
                { word: "inside", meaning: "adentro", type: "Place" },
                { word: "suddenly", meaning: "de repente", type: "Time" }
            ],
            quiz: [
                { q: "1. Who are the main characters in the story?", options: ["Mia Mouse and Leo Lion", "Barnaby Bear and Sammy", "Pip Bird and Toby", "Lily Rabbit and Tom"], answer: 0 },
                { q: "2. How do Mia and Leo feel at the beginning of the story?", options: ["Sleepy", "Hungry", "Sad", "Scared"], answer: 1 },
                { q: "3. What do Mia and Leo open to check their food?", options: ["A brown bag", "A toy box", "The kitchen cupboard", "A basket"], answer: 2 },
                { q: "4. Which vegetables are in the cupboard?", options: ["Corn and onions", "Mushrooms and peppers", "Carrots, peas, and cabbage", "Potatoes and beans"], answer: 2 },
                { q: "5. Are there any mangoes or pineapples in the cupboard?", options: ["Yes, there are.", "No, there aren't.", "Yes, there is one.", "Only two mangoes."], answer: 1 },
                { q: "6. Where do Mia and Leo go to buy fresh food?", options: ["To the park", "To the school", "To the market", "To the river"], answer: 2 },
                { q: "7. How many mangoes does Mia buy?", options: ["Two", "Three", "Four", "Six"], answer: 1 },
                { q: "8. What green fruit does Mia buy?", options: ["Four green kiwis", "Three green pears", "Two green apples", "Five green limes"], answer: 0 },
                { q: "9. What does Leo buy at the market?", options: ["Coconuts and lemons", "Corn, red peppers, and onions", "Bananas and strawberries", "Cabbage and peas"], answer: 1 },
                { q: "10. What does Mia see on the ground next to a basket?", options: ["A yellow lemon", "A shiny green lime", "A red pepper", "A brown coconut"], answer: 1 },
                { q: "11. What question does Mia ask when she picks up the lime?", options: ["What is this?", "Can I help you?", "Whose is it?", "How much is it?"], answer: 2 },
                { q: "12. Who is Pip?", options: ["A little bird", "A big bear", "A funny squirrel", "A fast rabbit"], answer: 0 },
                { q: "13. What does Pip say when Mia asks about the lime?", options: ["It's yours!", "It's his!", "It's mine!", "It's theirs!"], answer: 2 },
                { q: "14. What fruit is inside Pip's basket?", options: ["Pineapples", "Oranges", "Kiwis", "Mangoes"], answer: 1 },
                { q: "15. What do Mia and Leo make for lunch at home?", options: ["A fruit cake", "A carrot soup", "A corn and pea salad", "An onion sandwich"], answer: 2 }
            ]
        };
        // =========================================================================
        // 🔴 FIN DE LA ZONA DE DATOS (NO ES NECESARIO MODIFICAR NADA DE AQUÍ ABAJO)
        // =========================================================================

        document.getElementById('page-title').innerText = storyData.title;
        document.getElementById('story-title').innerText = storyData.title;
        document.getElementById('story-subtitle').innerText = storyData.subtitle;

        document.getElementById('image-container').innerHTML = `
            <img src="${storyData.imageFile}" alt="${storyData.title}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <div style="display:none; padding: 35px 20px; color: #b07d2b; font-weight: 700;">
                🖼️ Espacio reservado para la imagen del cuento<br>
                <small style="font-weight: 400;">(Cambia <code>imageFile: "${storyData.imageFile}"</code> por tu imagen)</small>
            </div>
        `;

        const paragraphsDiv = document.getElementById('story-paragraphs');
        storyData.paragraphs.forEach(text => {
            const formattedText = text.replace(/<b>/g, '<span class="vocab-highlight">').replace(/<\/b>/g, '</span>');
            paragraphsDiv.innerHTML += `
                <div class="paragraph-row">
                    <button class="audio-btn" onclick="speakParagraph(this)">🔊 Listen</button>
                    <p>${formattedText}</p>
                </div>
            `;
        });

        const verbsBody = document.getElementById('verbs-table-body');
        storyData.verbs.forEach(v => {
            verbsBody.innerHTML += `
                <tr>
                    <td><button class="mini-audio-btn" onclick="speakWord('${v.base}')">🔊</button><strong>${v.base}</strong></td>
                    <td><button class="mini-audio-btn" onclick="speakWord('${v.third}')">🔊</button><strong>${v.third}</strong></td>
                    <td>${v.meaning}</td>
                </tr>
            `;
        });

        const wordsBody = document.getElementById('words-table-body');
        storyData.otherWords.forEach(w => {
            wordsBody.innerHTML += `
                <tr>
                    <td><button class="mini-audio-btn" onclick="speakWord('${w.word}')">🔊</button><strong>${w.word}</strong></td>
                    <td>${w.meaning}</td>
                    <td><span class="badge-type">${w.type}</span></td>
                </tr>
            `;
        });

        const quizContainer = document.getElementById('quiz-container');
        const letters = ['A', 'B', 'C', 'D'];
        storyData.quiz.forEach((item, index) => {
            let optionsHTML = '<div class="options-grid">';
            item.options.forEach((opt, optIdx) => {
                optionsHTML += `
                    <label class="option-label">
                        <input type="radio" name="q${index}" value="${optIdx}">
                        <span>${letters[optIdx]}) ${opt}</span>
                    </label>
                `;
            });
            optionsHTML += '</div>';
            quizContainer.innerHTML += `
                <div class="question-block">
                    <div class="question-title">${item.q}</div>
                    ${optionsHTML}
                    <div class="feedback-msg" id="feedback-${index}"></div>
                </div>
            `;
        });

        function gradeQuiz() {
            let score = 0;
            storyData.quiz.forEach((item, index) => {
                const selected = document.querySelector(`input[name="q${index}"]:checked`);
                const feedback = document.getElementById(`feedback-${index}`);
                feedback.style.display = 'block';
                if (selected && parseInt(selected.value) === item.answer) {
                    score++;
                    feedback.className = 'feedback-msg feedback-correct';
                    feedback.innerText = '✨ Correct!';
                } else {
                    feedback.className = 'feedback-msg feedback-incorrect';
                    feedback.innerText = `❌ Incorrect (Correct: ${letters[item.answer]})`;
                }
            });
            const finalScoreDiv = document.getElementById('final-score');
            finalScoreDiv.style.display = 'block';
            finalScoreDiv.innerHTML = score === storyData.quiz.length
                ? `🎉 Super Reader! You got ${score} out of ${storyData.quiz.length} correct! ⭐`
                : `👏 Great job! Your score is ${score} out of ${storyData.quiz.length}. Keep practicing!`;
            finalScoreDiv.scrollIntoView({ behavior: 'smooth' });
        }

        let currentRow = null;
        function getEnglishVoice() {
            const voices = window.speechSynthesis.getVoices();
            return voices.find(v => v.lang === 'en-US' && v.name.includes('Google')) ||
                   voices.find(v => v.lang.startsWith('en-US')) ||
                   voices.find(v => v.lang.startsWith('en'));
        }
        function speakParagraph(btn) {
            window.speechSynthesis.cancel();
            if (currentRow) currentRow.classList.remove('speaking');
            const row = btn.parentElement;
            const utterance = new SpeechSynthesisUtterance(row.querySelector('p').innerText);
            const voice = getEnglishVoice();
            if (voice) utterance.voice = voice;
            utterance.lang = 'en-US';
            utterance.rate = 0.8;
            row.classList.add('speaking');
            currentRow = row;
            utterance.onend = () => { row.classList.remove('speaking'); currentRow = null; };
            window.speechSynthesis.speak(utterance);
        }
        function speakWord(word) {
            window.speechSynthesis.cancel();
            if (currentRow) currentRow.classList.remove('speaking');
            const utterance = new SpeechSynthesisUtterance(word);
            const voice = getEnglishVoice();
            if (voice) utterance.voice = voice;
            utterance.lang = 'en-US';
            utterance.rate = 0.8;
            window.speechSynthesis.speak(utterance);
        }
        window.speechSynthesis.onvoiceschanged = getEnglishVoice;
    </script>
</body>
</html>
