<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Rincón de los Cuentos</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --color-fondo: #FDF8F2;
            --color-tarjeta: #FFFFFF;
            --color-primario: #4A7C59;
            --color-secundario: #E07A5F;
            --color-texto: #2B2D42;
            --color-suave: #6C757D;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--color-fondo);
            color: var(--color-texto);
            line-height: 1.6;
            padding: 20px;
        }

        .contenedor-principal {
            max-width: 1050px;
            margin: 0 auto;
            padding: 20px 10px;
        }

        /* Encabezado de bienvenida */
        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 35px 20px;
            background-color: var(--color-tarjeta);
            border-radius: 28px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.04);
        }

        header h1 {
            font-size: 2.6rem;
            color: var(--color-primario);
            font-weight: 800;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.2rem;
            color: var(--color-suave);
            max-width: 600px;
            margin: 0 auto;
        }

        /* Botones de filtro por tema */
        .filtros {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 35px;
        }

        .boton-filtro {
            background-color: var(--color-tarjeta);
            border: 2px solid #E2DDD5;
            color: var(--color-texto);
            font-family: 'Nunito', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .boton-filtro:hover {
            border-color: var(--color-primario);
            color: var(--color-primario);
        }

        .boton-filtro.activo {
            background-color: var(--color-primario);
            border-color: var(--color-primario);
            color: white;
        }

        /* Cuadrícula de cuentos */
        .grid-cuentos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 28px;
        }

        /* Tarjeta individual de cada cuento */
        .tarjeta-cuento {
            background-color: var(--color-tarjeta);
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
        }

        .tarjeta-cuento:hover {
            transform: translateY(-6px);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.1);
        }

        .tarjeta-imagen {
            width: 100%;
            height: 190px;
            background-color: #F0ECE1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .tarjeta-imagen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .tarjeta-contenido {
            padding: 24px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .etiqueta {
            display: inline-block;
            align-self: flex-start;
            font-size: 0.78rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 5px 12px;
            border-radius: 15px;
            margin-bottom: 12px;
        }

        /* Colores según el tema */
        .tema-empatia { background-color: #E8F3EC; color: #3A6B4C; }
        .tema-valentia { background-color: #FCECE8; color: #C85A3F; }
        .tema-frustracion { background-color: #EBF2FA; color: #3B6998; }
        .tema-risa { background-color: #F3E8FF; color: #6B3FA0; }

        .tarjeta-contenido h2 {
            font-size: 1.4rem;
            color: var(--color-texto);
            margin-bottom: 10px;
            line-height: 1.3;
            font-weight: 800;
        }

        .tarjeta-contenido p {
            font-size: 0.98rem;
            color: var(--color-suave);
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .leer-mas {
            font-weight: 800;
            color: var(--color-secundario);
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            color: var(--color-suave);
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            header h1 { font-size: 2rem; }
            .grid-cuentos { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="contenedor-principal">
        
        <header>
            <h1>📚 Nuestros Cuentos Especiales</h1>
            <p>Historias creadas para descubrir emociones, ser valientes y entender el mundo juntos.</p>
        </header>

        <!-- BOTONES PARA FILTRAR POR TEMA -->
        <div class="filtros">
            <button class="boton-filtro activo" onclick="filtrarCuentos('todos', this)">Todos los cuentos</button>
            <button class="boton-filtro" onclick="filtrarCuentos('valentia', this)">🦁 Valentía y Miedos</button>
            <button class="boton-filtro" onclick="filtrarCuentos('empatia', this)">💛 Empatía y Amistad</button>
            <button class="boton-filtro" onclick="filtrarCuentos('frustracion', this)">🌈 Paciencia y Calma</button>
            <button class="boton-filtro" onclick="filtrarCuentos('risa', this)">✨ Aventuras y Risa</button>
        </div>

        <!-- CONTENEDOR VACÍO (Se rellena automáticamente desde cuentos.js) -->
        <main class="grid-cuentos" id="contenedor-cuentos"></main>

        <footer>
            Hecho con mucho amor para leer juntos cada noche ✨
        </footer>

    </div>

    <!-- Cargamos la base de datos de cuentos -->
    <script src="cuentos.js"></script>
    <script>
        const contenedor = document.getElementById('contenedor-cuentos');

        // Generar tarjetas automáticamente desde el objeto CUENTOS
        if (typeof CUENTOS !== 'undefined') {
            Object.keys(CUENTOS).forEach(id => {
                const c = CUENTOS[id];
                const tarjeta = document.createElement('a');
                tarjeta.href = `cuento.html?id=${id}`;
                tarjeta.className = 'tarjeta-cuento';
                tarjeta.setAttribute('data-categoria', c.categoria);

                tarjeta.innerHTML = `
                    <div class="tarjeta-imagen">
                        <img src="${c.imagen}" alt="${c.titulo}" onerror="this.style.display='none'; this.parentElement.innerHTML='<span style=\\'font-size:3rem;\\'>${c.emojiRespaldo || '📖'}</span>';">
                    </div>
                    <div class="tarjeta-contenido">
                        <span class="etiqueta tema-${c.categoria}">${c.temaTexto}</span>
                        <h2>${c.titulo}</h2>
                        <p>${c.resumen}</p>
                        <span class="leer-mas">Leer cuento →</span>
                    </div>
                `;
                contenedor.appendChild(tarjeta);
            });
        }

        function filtrarCuentos(categoria, botonSeleccionado) {
            const botones = document.querySelectorAll('.boton-filtro');
            botones.forEach(btn => btn.classList.remove('activo'));
            botonSeleccionado.classList.add('activo');

            const tarjetas = document.querySelectorAll('.tarjeta-cuento');
            tarjetas.forEach(tarjeta => {
                if (categoria === 'todos' || tarjeta.getAttribute('data-categoria') === categoria) {
                    tarjeta.style.display = 'flex';
                } else {
                    tarjeta.style.display = 'none';
                }
            });
        }
    </script>

</body>
</html>
